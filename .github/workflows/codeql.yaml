name: "CodeQL"

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 7 * * 1" # Mondays at 7:00 AM

permissions: read-all

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-22.04
    permissions:
      security-events: write

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@900f2210b1d28bbbd0bd22d17926b9e224e8f231

      - name: Initialize CodeQL
        uses: github/codeql-action/init@d1eb1207b45130d2edf64a0aa1c93be23510592f
        with:
          languages: go

      - name: Autobuild
        uses: github/codeql-action/autobuild@d1eb1207b45130d2edf64a0aa1c93be23510592f

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@d1eb1207b45130d2edf64a0aa1c93be23510592f
